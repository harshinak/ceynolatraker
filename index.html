<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceynola Business Tracker</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
  --text:#eef0f3; --sub:#9aa3b2; --accent:#3ea6ff; --accent2:#ffb84d;
  --good:#4ade80; --bad:#f87171;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f7; --card:#ffffff; --card2:#f0f2f5;
    --line:#e2e5ea; --text:#1a1d24; --sub:#5c6472;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a; --text:#eef0f3; --sub:#9aa3b2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:16px;
}
.wrap{max-width:900px;margin:0 auto;}
h1{font-size:1.3rem;margin:4px 0 2px;}
.sub{color:var(--sub);font-size:.85rem;margin-bottom:16px;}
.total-card{
  background:linear-gradient(135deg,var(--card),var(--card2));
  border:1px solid var(--line); border-radius:16px; padding:18px 20px;
  text-align:center; margin-bottom:18px;
}
.total-card .label{color:var(--sub);font-size:.85rem;}
.total-card .amt{font-size:2.1rem;font-weight:700;margin-top:4px;}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.cols{grid-template-columns:1fr;}}
.box{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; overflow-x:auto;
}
.box h2{font-size:1rem; margin:0 0 6px;}
.box .amt{font-size:1.5rem;font-weight:700;margin-bottom:10px;}
.box.left .amt{color:var(--accent);}
.box.right .amt{color:var(--accent2);}
.entry-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.entry-row input{flex:1; min-width:90px;}
.entry-row button{flex-shrink:0;}
input, select{
  background:var(--card2); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:8px 10px; font-size:.9rem; width:100%;
}
button{
  background:var(--accent); color:#fff; border:none; border-radius:8px;
  padding:8px 14px; font-size:.9rem; font-weight:600; cursor:pointer; white-space:nowrap;
}
button:active{transform:scale(.97);}
ul.list{list-style:none; padding:0; margin:10px 0 0; max-height:240px; overflow-y:auto;}
ul.list li{
  display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  padding:7px 0; border-bottom:1px solid var(--line); font-size:.87rem;
}
ul.list li .info{display:flex; flex-direction:column;}
ul.list li .note{color:var(--sub); font-size:.78rem; margin-top:2px;}
ul.list li .rm{cursor:pointer; color:var(--bad); font-size:.8rem; flex-shrink:0;}
.exp-box{margin-top:16px;}
.exp-form{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.exp-form input{flex:1; min-width:100px;}
.exp-form select{flex:1; min-width:110px;}
.exp-form button{flex-shrink:0;}
.balance{margin-top:14px; font-size:.9rem; color:var(--sub); text-align:center;}
.balance b{color:var(--good);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ceynola Business Tracker</h1>
  <div class="sub">Track capital contributions and expenses in one place</div>

  <div class="total-card">
    <div class="label">Total Business Capital</div>
    <div class="amt" id="totalCapital">Rs. 0</div>
    <button style="margin-top:12px" onclick="generatePDF()">Download PDF Report</button>
  </div>

  <div class="cols">
    <div class="box left">
      <h2>Harshana</h2>
      <div class="amt" id="meTotal">Rs. 0</div>
      <div class="entry-row">
        <input type="number" id="meAmt" placeholder="Amount">
        <input type="text" id="meNote" placeholder="What is this for?">
        <button onclick="addContribution('me')">+ Add</button>
      </div>
      <ul class="list" id="meList"></ul>
    </div>

    <div class="box right">
      <h2>Chamode</h2>
      <div class="amt" id="friendTotal">Rs. 0</div>
      <div class="entry-row">
        <input type="number" id="friendAmt" placeholder="Amount">
        <input type="text" id="friendNote" placeholder="What is this for?">
        <button onclick="addContribution('friend')">+ Add</button>
      </div>
      <ul class="list" id="friendList"></ul>
    </div>
  </div>

</div>

let db = null;
let state = { contributions: [] };
const NAMES = { me: "Harshana", friend: "Chamode" };
const LS_KEY = "ceynola_contributions";

function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.contributions)); }
  catch(e){ console.error("localStorage save failed:", e); }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ console.error("localStorage load failed:", e); return []; }
}

function fmt(n){ return "Rs. " + Number(n||0).toLocaleString("en-LK"); }

function render(){
  const me = state.contributions.filter(c=>c.partner==="me");
  const fr = state.contributions.filter(c=>c.partner==="friend");
  const meSum = me.reduce((s,c)=>s+Number(c.amount),0);
  const frSum = fr.reduce((s,c)=>s+Number(c.amount),0);

  document.getElementById("meTotal").textContent = fmt(meSum);
  document.getElementById("friendTotal").textContent = fmt(frSum);
  document.getElementById("totalCapital").textContent = fmt(meSum+frSum);

  document.getElementById("meList").innerHTML = me.slice().reverse().map(c=>
    `<li><div class="info"><span>${fmt(c.amount)}</span>${c.note?`<span class="note">${c.note}</span>`:""}</div><span class="rm" onclick="removeItem('contributions','${c.id}')">Remove</span></li>`).join("");
  document.getElementById("friendList").innerHTML = fr.slice().reverse().map(c=>
    `<li><div class="info"><span>${fmt(c.amount)}</span>${c.note?`<span class="note">${c.note}</span>`:""}</div><span class="rm" onclick="removeItem('contributions','${c.id}')">Remove</span></li>`).join("");
}

async function init(){
  try{
    if(typeof claude !== "undefined" && claude.use){
      db = await claude.use("db");
    }
  }catch(e){ db = null; }

  if(db){
    try{
      db.collection("contributions").onSnapshot((snap)=>{
        state.contributions = snap.docs.map(d=>({id:d.id, ...d.data()}));
        render();
      }, (err)=>{ console.error("db error:", err); });
    }catch(e){ console.error(e); }
  } else {
    // Standalone deployment (e.g. GitHub Pages) - use localStorage per browser
    state.contributions = loadLocal();
  }
  render();
}

async function addContribution(partner){
  const amtInput = document.getElementById(partner+"Amt");
  const noteInput = document.getElementById(partner+"Note");
  const amount = Number(amtInput.value);
  const note = noteInput.value.trim();
  if(!amount || amount<=0) return;
  const entry = {partner, amount, note, ts:Date.now()};
  amtInput.value = ""; noteInput.value = "";
  if(db){
    try{ await db.collection("contributions").add(entry); }
    catch(e){ console.error(e); fallbackAdd("contributions", entry); }
  } else {
    fallbackAdd("contributions", entry);
  }
}

function fallbackAdd(coll, entry){
  entry.id = "local_"+Date.now()+Math.random().toString(36).slice(2);
  state[coll].push(entry);
  if(coll === "contributions") saveLocal();
  render();
}

function addWatermark(doc, pageW, pageH){
  try{
    const size = 100;
    const x = (pageW - size) / 2;
    const y = (pageH - size) / 2;
    doc.saveGraphicsState();
    if(doc.setGState && doc.GState){
      doc.setGState(new doc.GState({ opacity: 0.08 }));
    }
    doc.addImage(LOGO_DATA_URI, "PNG", x, y, size, size);
    doc.restoreGraphicsState();
  }catch(e){ console.error("watermark error:", e); }
}

async function generatePDF(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();

    const me = state.contributions.filter(c=>c.partner==="me");
    const fr = state.contributions.filter(c=>c.partner==="friend");
    const meSum = me.reduce((s,c)=>s+Number(c.amount),0);
    const frSum = fr.reduce((s,c)=>s+Number(c.amount),0);

    addWatermark(doc, pageW, pageH);

    const logoSize = 30;
    doc.addImage(LOGO_DATA_URI, "PNG", pageW/2 - 62, 2, logoSize, logoSize);

    doc.setFontSize(20);
    doc.setFont(undefined, "bold");
    doc.text("CEYNOLA CINNAMON", pageW/2, 15, { align: "center" });
    doc.setFont(undefined, "normal");
    doc.setFontSize(11);
    doc.text("Business Capital & Contribution Report", pageW/2, 22, { align: "center" });
    doc.setFontSize(9);
    doc.text("Generated: " + new Date().toLocaleString("en-LK"), pageW/2, 28, { align: "center" });

    const goldColor = [196, 155, 60];
    doc.setDrawColor(goldColor[0], goldColor[1], goldColor[2]);
    doc.setLineWidth(1);
    doc.line(14, 32, pageW - 14, 32);

    doc.setFontSize(12);
    let y = 42;
    doc.setTextColor(30, 90, 220);
    doc.text("Total Business Capital: " + fmt(meSum+frSum), pageW/2, y, { align: "center" });
    doc.setTextColor(0,0,0);
    y += 12;

    const colW = (pageW - 14 - 14 - 10) / 2;
    const leftX = 14;
    const rightX = 14 + colW + 10;
    const headerY = y;

    doc.setFontSize(13);
    doc.setFont(undefined, "bold");
    doc.text(NAMES.me, leftX, headerY);
    doc.text(NAMES.friend, rightX, headerY);
    doc.setFont(undefined, "normal");
    doc.setFontSize(10);
    doc.text("Total: " + fmt(meSum), leftX, headerY + 6);
    doc.text("Total: " + fmt(frSum), rightX, headerY + 6);

    let leftY = headerY + 14;
    let rightY = headerY + 14;

    function renderColumn(list, x, yStart){
      let yy = yStart;
      if(list.length === 0){
        doc.text("No records.", x, yy);
        return yy + 6;
      }
      list.slice().reverse().forEach(c=>{
        const d = new Date(c.ts);
        const dateStr = d.toLocaleDateString("en-LK") + " " + d.toLocaleTimeString("en-LK");
        const line = fmt(c.amount) + (c.note ? " (" + c.note + ")" : "");
        const wrapped = doc.splitTextToSize(line, colW);
        wrapped.forEach(l=>{
          if(yy > pageH - 20){ doc.addPage(); addWatermark(doc, pageW, pageH); yy = 20; }
          doc.text(l, x, yy); yy += 5;
        });
        doc.setTextColor(140,140,140);
        doc.setFontSize(8);
        doc.text(dateStr, x, yy); yy += 7;
        doc.setFontSize(10);
        doc.setTextColor(0,0,0);
      });
      return yy;
    }

    const leftEnd = renderColumn(me, leftX, leftY);
    const rightEnd = renderColumn(fr, rightX, rightY);

    let downloads = null;
    try{
      if(typeof claude !== "undefined" && claude.use){
        downloads = await claude.use("downloads");
      }
    }catch(e){ downloads = null; }

    if(downloads){
      const blob = doc.output("blob");
      try{
        await downloads.save({ filename: "ceynola-business-report.pdf", data: blob });
      }catch(e){
        if(e && e.code !== "declined") console.error("download error:", e);
      }
    } else {
      // Standalone file (opened directly, not via claude.ai) - use normal browser download
      doc.save("ceynola-business-report.pdf");
    }
  }catch(e){
    console.error("PDF generation failed:", e);
    alert("Could not generate the PDF. Please try again.");
  }
}

async function removeItem(coll, id){
  if(db && !id.startsWith("local_")){
    try{ await db.collection(coll).doc(id).delete(); return; }
    catch(e){ console.error(e); }
  }
  state[coll] = state[coll].filter(x=>x.id!==id);
  if(coll === "contributions") saveLocal();
  render();
}

init();
</script>
